# 应用名称
spring.application.name=open-api-backend
# 自动加载本地敏感配置（application-local.properties）
# 部署生产环境时，通过 -Dspring.profiles.active=prod 覆盖，不加载 local
spring.profiles.include=local
# Server 配置
server.port=8080

# ======================================
# MySQL 数据库配置
# 敏感值请在 application-local.properties 中覆盖
# ======================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/open_api}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Session 配置
spring.session.timeout=86400
spring.session.store-type=redis

# ======================================
# Redis 配置
# 敏感值请在 application-local.properties 中覆盖
# ======================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0

# MyBatis-Plus 配置
# 开启驼峰命名转换
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.logic-delete-field=is_delete
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# SpringDoc 配置
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
# 分组配置
springdoc.group-configs[0].group=default
springdoc.group-configs[0].paths-to-match=/**
springdoc.group-configs[0].packages-to-scan=com.bqy.openapibackend.controller
# Knife4j 高级配置
knife4j.enable=true
knife4j.setting.language=zh_cn
knife4j.production=false

# 接口默认值
api.url=${API_BASE_URL:http://localhost:8080/api/apiInfo/invoke-with-key/}

# 文件上传配置
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# 头像本地存储路径（绝对路径，避免 Tomcat 工作目录问题）
# 请在 application-local.properties 中覆盖为实际部署路径
avatar.upload.dir=${AVATAR_UPLOAD_DIR:./uploads/avatars}
# 头像访问前缀（与静态资源映射一致，无 context-path）
avatar.access.prefix=${AVATAR_ACCESS_PREFIX:http://localhost:8080/uploads/avatars}

# ======================================
# ZhiPu AI 配置
# 获取 API Key: https://bigmodel.cn/usercenter/proj-mgmt/apikeys
# 敏感值请在 application-local.properties 中覆盖
# ======================================
zhipu.api.key=${ZHIPU_API_KEY:}
zhipu.api.url=https://open.bigmodel.cn/api/paas/v4/chat/completions
#zhipu.api.model=GLM-4.7-Flash
zhipu.api.model=GLM-4.6

# ======================================
# API 告警配置
# ======================================
# 告警定时扫描 cron 表达式，默认每 5 分钟扫描一次
alert.scheduler-cron=0 */5 * * * *
# 统计窗口（分钟）：扫描最近 N 分钟的调用数据，默认 30 分钟
alert.window-minutes=30
# 失败率 WARNING 阈值（百分比），默认 30%
alert.fail-rate-warning-threshold=30.0
# 失败率 CRITICAL 阈值（百分比），默认 60%
alert.fail-rate-critical-threshold=60.0
# 响应时间 WARNING 阈值（ms），默认 2000ms
alert.response-time-warning-threshold=2000
# 响应时间 CRITICAL 阈值（ms），默认 5000ms
alert.response-time-critical-threshold=5000
# 无调用告警窗口（分钟），默认 60 分钟
alert.no-calls-window-minutes=60
# 触发失败率/响应时间告警所需的最小调用次数，默认 5 次
alert.min-calls-for-alert=5
# 防重复告警窗口（分钟）：同一 API 同一类型的告警在该时间内不重复触发，默认 60 分钟
alert.deduplication-window-minutes=60
