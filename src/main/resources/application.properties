#\u5E94\u7528\u540D\u79F0
spring.application.name=open-api-backend
#Server \u914D\u7F6E
server.port=8080
server.servlet.context-path=/api
# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/open_api
spring.datasource.username=root
spring.datasource.password=922428
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# SQL Initialization
#spring.sql.init.schema-locations=classpath:db/schema-mysql.sql
#spring.sql.init.data-locations=classpath:db/data-mysql.sql
# Session \u914D\u7F6E
spring.session.timeout=86400
spring.session.store-type=redis
# Redis \u914D\u7F6E
spring.data.redis.port=6379
spring.data.redis.host=localhost
spring.data.redis.database=0
# MyBatis-Plus \u914D\u7F6E
# \u5F00\u542F\u9A7C\u5CF0\u547D\u540D\u8F6C\u6362
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.logic-delete-field=is_delete
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
# SpringDoc \u914D\u7F6E
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
# \u5206\u7EC4\u914D\u7F6E
springdoc.group-configs[0].group=default
springdoc.group-configs[0].paths-to-match=/**
springdoc.group-configs[0].packages-to-scan=com.bqy.openapibackend.controller
# Knife4j \u9AD8\u7EA7\u914D\u7F6E
knife4j.enable=true
knife4j.setting.language=zh_cn
knife4j.production=false
# \u63A5\u53E3\u9ED8\u8BA4\u503C
api.url=http://localhost:8080/api/apiInfo/invoke/
